<!-- Across-Words: tela de carregamento exclusiva da exportacao Web -->
<style>
  #aw-loading { position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center; background:#2a222d; color:#f9dfe0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; transition:opacity .35s ease; }
  #aw-loading.aw-done { opacity:0; pointer-events:none; }
  #aw-loading .aw-panel { width:min(82vw,380px); text-align:center; }
  #aw-loading .aw-brand { font-size:clamp(32px,7vw,54px); font-weight:900; letter-spacing:.09em; line-height:1.05; }
  #aw-loading .aw-brand span { display:block; color:#f3b5c8; }
  #aw-loading .aw-subtitle { margin:16px 0 32px; font-size:14px; color:#d5b9c6; }
  #aw-loading .aw-track { height:9px; overflow:hidden; border-radius:20px; background:#594551; }
  #aw-loading .aw-bar { height:100%; width:0%; background:#f3b5c8; border-radius:20px; transition:width .18s ease; }
  #aw-loading .aw-caption { margin-top:14px; font-size:13px; color:#d5b9c6; }
  #status-splash, #status-progress, #status-notice { display:none !important; }
  #aw-retry { display:none; margin:18px auto 0; padding:10px 20px; border:1px solid #f3b5c8; border-radius:9px; background:#594551; color:#fff0f4; font:inherit; cursor:pointer; }
  #aw-loading.aw-error #aw-retry { display:block; }
</style>
<div id="aw-loading" role="status" aria-live="polite">
  <div class="aw-panel">
    <div class="aw-brand">ACROSS<span>WORDS</span></div>
    <div class="aw-subtitle">Explore palavras. Descubra caminhos.</div>
    <div class="aw-track"><div id="aw-progress" class="aw-bar"></div></div>
    <div id="aw-caption" class="aw-caption">Carregando o jogo...</div>
    <button id="aw-retry" type="button" onclick="location.reload()">Tentar novamente</button>
  </div>
</div>
<script>
(function () {
  'use strict';
  const overlay = document.getElementById('aw-loading');
  const bar = document.getElementById('aw-progress');
  const caption = document.getElementById('aw-caption');
  const status = document.getElementById('status');
  const progress = document.getElementById('status-progress');
  const notice = document.getElementById('status-notice');
  let finished = false;
  let failed = false;
  function dismiss() {
    if (finished) return;
    finished = true;
    bar.style.width = '100%';
    overlay.classList.add('aw-done');
    window.setTimeout(() => overlay.remove(), 420);
  }
  function sync() {
    if (finished) return;
    if (progress) {
      const value = Number(progress.value);
      const max = Number(progress.max);
      if (max > 0 && Number.isFinite(value)) {
        bar.style.width = Math.max(0, Math.min(100, value / max * 100)) + '%';
      }
    }
    if (notice && notice.textContent.trim() && getComputedStyle(notice).display !== 'none') {
      caption.textContent = notice.textContent.trim();
    }
    // O Godot mantém o elemento #error no DOM mesmo sem erro.
    // Só impedir a conclusão se houver uma mensagem de erro realmente visível.
    const error = document.getElementById('error');
    const hasError = !!(error && error.textContent.trim() && getComputedStyle(error).display !== 'none');
    if (hasError) {
      failed = true;
      caption.textContent = 'Não foi possível iniciar o jogo.';
      overlay.classList.add('aw-error');
      return;
    }
    const canvas = document.getElementById('canvas') || document.querySelector('canvas');
    const canvasReady = !!(canvas && getComputedStyle(canvas).display !== 'none' && canvas.width > 0 && canvas.height > 0);
    if (status && getComputedStyle(status).display === 'none' && canvasReady) dismiss();
  }
  // Observa a inicializacao mesmo se o status ja estiver oculto ao carregar.
  if (status) new MutationObserver(sync).observe(status, { attributes: true, attributeFilter: ['style', 'class'] });
  if (progress) new MutationObserver(sync).observe(progress, { attributes: true, attributeFilter: ['value', 'max', 'style'] });
  if (notice) new MutationObserver(sync).observe(notice, { attributes: true, childList: true, characterData: true, subtree: true });
  window.addEventListener('load', () => window.setTimeout(sync, 200), { once: true });
  // Sem prazo artificial: acompanha a conclusao real, inclusive em redes lentas.
  // O polling complementa o observer para mudancas feitas diretamente no canvas.
  window.setInterval(sync, 350);
})();
</script>
